name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        required: true
        type: string

      tag:
        description: "Comma-separated Docker tags"
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: "Full Docker image path"
        value: ${{ jobs.docker.outputs.image_url }}

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker tags
        id: tags
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAGS: ${{ inputs.tag }}
        run: |
          {
            echo "tags<<EOF"
            IFS=',' read -ra TAG_ARRAY <<< "$TAGS"

            for tag in "${TAG_ARRAY[@]}"; do
              echo "${IMAGE_NAME}:$(echo "$tag" | xargs)"
            done

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Set image output
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAGS: ${{ inputs.tag }}
        run: |
          FIRST_TAG=$(echo "$TAGS" | cut -d',' -f1 | xargs)
          echo "image_url=${IMAGE_NAME}:${FIRST_TAG}" >> "$GITHUB_OUTPUT"